<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>流量异常监控中心</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; padding-top: 40px; }
        .container { max-width: 1200px; }
        .card { box-shadow: 0 4px 15px rgba(0,0,0,0.06); border-radius: 12px; border: none; }
        .table-container { margin-top: 20px; overflow-x: auto; max-height: 600px; border-radius: 8px; }
        th { background-color: #2c3e50 !important; color: white !important; position: sticky; top: 0; }
        .status-badge { font-size: 1.1rem; padding: 10px 20px; }
        .glow-text { transition: color 0.3s ease; }
    </style>
</head>
<body>

<div class="container">
    <div class="row align-items-center mb-4">
        <div class="col-md-8">
            <h1 class="fw-bold text-dark">网络行为智能分析与预警平台</h1>
            <p class="text-muted mb-0">基于 决策树 的实时检测引擎</p>
        </div>
        <div class="col-md-4 text-end">
            <button id="toggleBtn" class="btn btn-lg btn-success shadow-sm px-4">
                ▶ 启动实时监控
            </button>
        </div>
    </div>

    <div class="card p-3 mb-4 bg-white">
        <div class="row text-center align-items-center">
            <div class="col-md-4 border-end">
                <span class="text-muted d-block small mb-1">引擎运行状态</span>
                <span id="engineStatus" class="badge bg-secondary status-badge">离线 休眠中</span>
            </div>
            <div class="col-md-4 border-end">
                <span class="text-muted d-block small mb-1">最新分析窗口 (PCAP)</span>
                <strong id="latestFile" class="text-primary d-block glow-text">暂无数据</strong>
            </div>
            <div class="col-md-4">
                <span class="text-muted d-block small mb-1">本窗口提取 TCP 流</span>
                <strong id="flowCount" class="text-success d-block fs-4 glow-text">0</strong>
            </div>
        </div>
    </div>

    <div class="card p-4">
        <h5 class="card-title fw-bold border-bottom pb-3 mb-0">网络实体行为定性审计</h5>
        <div class="table-container" id="tableContainer">
            <div class='text-center text-muted py-5'>引擎未启动</div>
        </div>
    </div>
</div>

<script>
    let isRunning = false;
    const toggleBtn = document.getElementById('toggleBtn');
    const engineStatus = document.getElementById('engineStatus');
    const latestFile = document.getElementById('latestFile');
    const flowCount = document.getElementById('flowCount');
    const tableContainer = document.getElementById('tableContainer');

    toggleBtn.addEventListener('click', function() {
        const action = isRunning ? 'stop' : 'start';
        toggleBtn.disabled = true; 
        
        fetch('/api/toggle', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: action })
        })
        .then(response => response.json())
        .then(data => {
            toggleBtn.disabled = false;
            updateUIState(data.is_running);
        });
    });

    function updateUIState(running) {
        isRunning = running;
        if (isRunning) {
            toggleBtn.className = "btn btn-lg btn-danger shadow-sm px-4";
            toggleBtn.innerHTML = "■ 停止实时监控";
            engineStatus.className = "badge bg-success status-badge";
            engineStatus.innerHTML = "在线 抓取分析中...";
        } else {
            toggleBtn.className = "btn btn-lg btn-success shadow-sm px-4";
            toggleBtn.innerHTML = "▶ 启动实时监控";
            engineStatus.className = "badge bg-secondary status-badge";
            engineStatus.innerHTML = "离线 休眠中";
        }
    }

    setInterval(() => {
        fetch('/api/latest_data')
            .then(response => response.json())
            .then(data => {
                if (data.is_running !== isRunning) updateUIState(data.is_running);
                
                // 窗口更新时的文字闪烁提示效果
                if (latestFile.innerText !== data.latest_file && data.latest_file !== "等待初始化...") {
                    flowCount.classList.remove('text-success');
                    flowCount.classList.add('text-danger');
                    setTimeout(() => {
                        flowCount.classList.remove('text-danger');
                        flowCount.classList.add('text-success');
                    }, 800);
                }

                latestFile.innerText = data.latest_file;
                flowCount.innerText = data.flow_count;
                tableContainer.innerHTML = data.table_html;
            });
    }, 3000); 
</script>
</body>
</html>
