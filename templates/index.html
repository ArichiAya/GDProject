<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>恶意流量智能检测系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 50px; }
        .container { max-width: 1000px; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .table-container { margin-top: 30px; overflow-x: auto; }
        th { background-color: #2c3e50 !important; color: white !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="text-center mb-5">
        <h1 class="display-5 fw-bold">恶意网络流量智能检测系统</h1>
        <p class="lead text-muted">基于 XGBoost 与 NFStream 提取技术的在线分析引擎</p>
    </div>

    <div class="card p-4 mb-4">
        <form method="POST" enctype="multipart/form-data" class="row g-3 align-items-center">
            <div class="col-md-9">
                <label for="pcap_file" class="form-label fw-bold">请选择待分析的 PCAP 文件：</label>
                <input class="form-control" type="file" id="pcap_file" name="pcap_file" accept=".pcap,.pcapng" required>
            </div>
            <div class="col-md-3 mt-5">
                <button type="submit" class="btn btn-primary w-100">开始深度检测</button>
            </div>
        </form>
    </div>

    {% if table %}
    <div class="alert alert-success" role="alert">
        <strong>分析完成！</strong> 文件 <b>{{ filename }}</b> 共提取出 <b>{{ flow_count }}</b> 条网络流特征，分析结果如下：
    </div>

    <div class="card p-4 table-container">
        {{ table | safe }}
    </div>
    {% endif %}
</div>

</body>
</html>
